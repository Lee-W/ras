name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: ['22.18.0', '26.9.0']
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Set browser cache
        shell: bash
        run: echo "PUPPETEER_CACHE_DIR=$RUNNER_TEMP/ras-puppeteer" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Install pinned Chrome
        run: npx --no-install puppeteer browsers install chrome
      - name: Allow the CI Chrome binary to use its sandbox on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo tee /etc/apparmor.d/ras-chrome > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile ras-chrome "$PUPPETEER_CACHE_DIR/**/chrome" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/ras-chrome
      - run: npm run validate
      - run: npm test
      - run: npm run test:mutation
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        if: matrix.os == 'ubuntu-24.04' && matrix.node == '22.18.0'
      - run: npm run test:release
        if: matrix.os == 'ubuntu-24.04' && matrix.node == '22.18.0'
      - name: Export a standalone starter deck
        shell: bash
        run: |
          ras_fixture_dir="$(mktemp -d "$RUNNER_TEMP/ras-ci.XXXXXX")"
          node scripts/ras.mjs init "$ras_fixture_dir/talk"
          cd "$ras_fixture_dir/talk"
          npm ci
          npm run export
